# Python packages this image installs, pinned with hashes in uv.lock, see containers/README.md
#
# The timestral package itself is not on PyPI: the Dockerfile installs it with --no-deps from
# the source tarball of a pinned commit, its dependencies are the ones declared here.
[project]
name = "timestral-runner"
version = "0"
requires-python = "==3.13.*"
dependencies = [
    # Timestral inference needs torch>=2.4, numpy>=1.24, safetensors>=0.4 and huggingface_hub>=0.23
    "torch>=2.4",
    "numpy>=1.24",
    "safetensors>=0.4",
    "huggingface_hub>=0.23",
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
]

# Test-only packages, not exported into the image, task test runs the suite with them
[dependency-groups]
test = ["pytest", "httpx"]

[tool.uv]
# The images run on aarch64 Linux, the lock must resolve for that target but installs on developer machines too
required-environments = ["sys_platform == 'linux' and platform_machine == 'aarch64'"]

# CPU-only torch wheels on every platform: the PyPI wheels of x86_64 pull the CUDA libraries in
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
